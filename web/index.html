<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="navbar">
        <div class="logo">&#128221; C++ Notes App</div>
        <div class="nav-controls">
            <input type="text" id="searchInput" placeholder="Search notes..." onkeyup="handleSearch()">
            <button id="themeToggleBtn" onclick="toggleDarkMode()">&#127771; Dark Mode</button>
            <button id="logoutBtn" class="danger-btn" onclick="logout()" style="display: none;">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- SECTION 1: Authentication Form (Login / Register) -->
        <section id="authSection" class="card">
            <h2 id="authTitle">Login to your Notes</h2>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <button type="submit" id="authSubmitBtn" class="primary-btn">Login</button>
            </form>
            <p class="toggle-auth">
                <span id="authToggleText">Don't have an account?</span>
                <a href="#" onclick="toggleAuthMode(event)" id="authToggleLink">Register here</a>
            </p>
        </section>

        <!-- SECTION 2: Main Notes Dashboard (Hidden until logged in) -->
        <section id="appSection" style="display: none;">

            <!-- Create New Note Box -->
            <div class="card">
                <h3>Create New Note</h3>
                <form onsubmit="handleCreateNote(event)">
                    <div class="form-group">
                        <input type="text" id="noteTitle" required placeholder="Note Title...">
                    </div>
                    <div class="form-group">
                        <textarea id="noteContent" rows="4" required placeholder="Write your note content here..."></textarea>
                    </div>
                    <button type="submit" class="primary-btn">+ Add Note</button>
                </form>
            </div>

            <!-- Notes Grid Container -->
            <h2>Your Notes</h2>
            <div id="notesContainer" class="notes-grid">
                <!-- Dynamically populated by app.js -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
